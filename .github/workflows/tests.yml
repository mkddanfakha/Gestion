name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: gestion_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, mysql, pdo, pdo_mysql

      - name: Provision MySQL CI application user
        env:
          MYSQL_ROOT_PASSWORD: password
        run: |
          set -euo pipefail
          APP_PW="$(openssl rand -hex 24)"
          {
            echo "CI_GESTION_APP_PASSWORD<<EOF"
            echo "$APP_PW"
            echo "EOF"
          } >> "$GITHUB_ENV"
          mysql -h 127.0.0.1 -uroot "-p${MYSQL_ROOT_PASSWORD}" --connect-expired-password <<SQL
          CREATE USER IF NOT EXISTS 'gestion_app'@'%' IDENTIFIED BY '${APP_PW}';
          ALTER USER 'gestion_app'@'%' IDENTIFIED BY '${APP_PW}';
          GRANT ALL PRIVILEGES ON gestion_test.* TO 'gestion_app'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Prepare env for artisan bootstrap
        run: |
          touch database/database.sqlite
          echo "BROADCAST_DRIVER=log" >> .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Configure Environment for MySQL CI
        env:
          CI_GESTION_APP_PASSWORD: ${{ env.CI_GESTION_APP_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=gestion_test"
            echo "DB_USERNAME=gestion_app"
            echo "DB_PASSWORD=${CI_GESTION_APP_PASSWORD}"
            echo "DB_MIGRATION_ALLOWED_PAIRS=gestion_test:gestion_app"
            echo "DB_RUNTIME_ALLOWED_PAIRS=gestion_test:gestion_app"
          } >> .env

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest
